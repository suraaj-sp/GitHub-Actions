name: Test Project
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 20   # <-- Change from 18 to 20

      - name: Install dependences
        run: npm ci

      - name: Run tests
        run: npm test